name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and release, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # NSIS installer plus the portable zip.
            script: release:win
          - os: ubuntu-latest
            script: release:linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # The pacman target is built with fpm, which shells out to bsdtar and
      # zstd. Neither is on the Ubuntu runner by default. fpm itself is a Ruby
      # gem that electron-builder calls as an external process.
      - name: Install Arch packaging tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools zstd ruby-dev build-essential
          sudo gem install fpm --no-document

      - run: npm ci

      # A release that fails its own tests is worse than no release.
      - run: npm run typecheck
      - run: npm test

      - name: Build and publish
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v6
        with:
          name: flashgent-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.pacman
          if-no-files-found: warn
