name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # postinstall runs electron-builder install-app-deps, which rebuilds
      # better-sqlite3 against this Electron version.
      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # Proves the three bundles still build. The end-to-end suite is not run
      # here: it drives a real local model, which no runner has.
      - run: npm run build
